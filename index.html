<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스파이폴 - 추리 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <!-- 로비 화면 -->
    <div id="spy-login-screen" class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full text-center space-y-4 shadow-2xl">
        <h1 class="text-3xl font-black text-indigo-400">🕵️ 스파이폴</h1>
        <p class="text-xs text-slate-400">비밀 장소에서 스파이를 찾아내세요!</p>
        <input type="text" id="spy-name-input" placeholder="요원 닉네임 입력" maxlength="10" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-white font-bold focus:outline-none focus:border-indigo-500">
        <input type="text" id="spy-room-input" placeholder="방 코드 (참가 시 입력)" maxlength="6" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-indigo-300 font-mono font-bold uppercase focus:outline-none focus:border-indigo-500">
        <div class="flex gap-2 pt-2">
            <button onclick="createSpyRoom()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 rounded-xl transition shadow-lg">방 만들기</button>
            <button onclick="joinSpyRoom()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-xl transition shadow-lg">방 참가</button>
        </div>
    </div>

    <!-- 게임 플레이 화면 -->
    <div id="spy-game-screen" class="w-full max-w-3xl flex-1 flex flex-col gap-3 my-2 hidden">
        <!-- 상단 헤더 -->
        <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col gap-3 shadow-lg">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <h1 class="font-black text-indigo-400 text-lg">🕵️ 스파이폴</h1>
                    <span id="spy-room-badge" class="bg-slate-950 text-indigo-300 text-xs px-2.5 py-1 rounded-md font-mono font-bold"></span>
                    <button onclick="copySpyInviteLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-2.5 py-1 rounded-md font-bold transition">초대링크 복사</button>
                    <button onclick="leaveSpyRoom()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-2.5 py-1 rounded-md font-bold transition">방 나가기</button>
                </div>
                <div id="game-timer" class="text-rose-400 font-mono font-bold text-sm hidden">⏱️ 08:00</div>
            </div>
            <!-- 플레이어 목록 바 -->
            <div id="spy-players-bar" class="flex gap-2 overflow-x-auto border-t border-slate-800 pt-3"></div>
        </header>

        <!-- 내 정보 및 역할 카드 패널 -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center shadow-lg relative flex flex-col items-center justify-center min-h-[180px]">
            <div id="waiting-host-panel" class="space-y-4 w-full">
                <h2 class="text-sm font-bold text-indigo-300">최소 3명 이상 필요하며, 준비 완료 시 방장이 시작할 수 있습니다.</h2>
                <div id="spy-action-btn-area"></div>
            </div>

            <div id="role-card-panel" class="hidden space-y-3 w-full">
                <div class="inline-block bg-indigo-500/20 text-indigo-300 text-xs px-3 py-1 rounded-full font-bold">비밀 정보 카드</div>
                <div id="card-content" class="text-2xl font-black text-white"></div>
                <div id="turn-notice" class="text-sm font-bold text-amber-400 mt-2"></div>
            </div>
        </div>

        <!-- 하단: 턴 지목 컨트롤 & 투표 패널 -->
        <div id="control-panel" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg hidden">
            <div id="question-control" class="space-y-3">
                <div class="text-xs font-bold text-slate-400">상대방에게 질문하고 다음 순서로 지목하세요 (A ➡️ B)</div>
                <div class="flex gap-2">
                    <select id="target-select" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm font-bold text-white focus:outline-none"></select>
                    <button onclick="passTurn()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-xl text-sm font-black transition">질문 넘기기</button>
                </div>
            </div>
            
            <div id="spy-actions" class="flex gap-2 mt-3 pt-3 border-t border-slate-800">
                <button onclick="openAccuseModal()" class="flex-1 bg-rose-600 hover:bg-rose-500 py-2.5 rounded-xl text-xs font-bold transition">🚨 스파이 지목하기</button>
                <button onclick="openGuessModal()" id="spy-guess-btn" class="flex-1 bg-amber-600 hover:bg-amber-500 py-2.5 rounded-xl text-xs font-bold transition hidden">🕵️‍♂️ 장소 맞추기 선언</button>
            </div>
        </div>
    </div>

    <!-- 투표 모달 -->
    <div id="vote-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
            <h2 class="text-xl font-black text-rose-400">🚨 스파이 투표 진행 중</h2>
            <p id="vote-target-text" class="text-sm text-slate-300 font-bold"></p>
            <div class="flex gap-2 pt-2">
                <button onclick="castVote(true)" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-black text-white transition">찬성 👍</button>
                <button onclick="castVote(false)" class="flex-1 bg-rose-600 hover:bg-rose-500 py-3 rounded-xl font-black text-white transition">반대 👎</button>
            </div>
        </div>
    </div>

    <!-- 게임 종료 모달 -->
    <div id="spy-game-over-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-md w-full text-center space-y-4 shadow-2xl">
            <h2 class="text-2xl font-black text-indigo-400">🏁 게임 종료</h2>
            <p id="end-reason-text" class="text-base font-bold text-amber-300 bg-slate-950 p-4 rounded-xl"></p>
            <button onclick="location.reload()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold text-white transition">로비로 돌아가기</button>
        </div>
    </div>

    <script>
        // 소켓 연결 주소를 자동 호스트 연동 방식으로 수정
        const socket = io();

        function getSpyToken() {
            let token = localStorage.getItem('spy_token');
            if (!token) {
                token = 's_tok_' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('spy_token', token);
            }
            return token;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(location.search);
            const rParam = params.get('spy_room');
            if (rParam) document.getElementById('spy-room-input').value = rParam;
        });

        function createSpyRoom() {
            const name = document.getElementById('spy-name-input').value.trim();
            if (!name) { alert('닉네임을 입력하세요.'); return; }
            localStorage.setItem('spy_name', name);
            socket.emit('spy_create_room', { name, token: getSpyToken() });
        }

        function joinSpyRoom() {
            const name = document.getElementById('spy-name-input').value.trim();
            const roomId = document.getElementById('spy-room-input').value.trim();
            if (!name || !roomId) { alert('닉네임과 방 코드를 입력하세요.'); return; }
            localStorage.setItem('spy_name', name);
            localStorage.setItem('spy_room', roomId);
            socket.emit('spy_join_room', { name, roomId, token: getSpyToken() });
        }

        function leaveSpyRoom() {
            if (confirm('방을 나가시겠습니까?')) socket.emit('spy_leave_room', getSpyToken());
        }

        function copySpyInviteLink() {
            const roomId = document.getElementById('spy-room-badge').innerText;
            navigator.clipboard.writeText(`${location.origin}${location.pathname}?spy_room=${roomId}`);
            alert('초대 링크가 복사되었습니다!');
        }

        socket.on('spy_joined_success', (data) => {
            localStorage.setItem('spy_room', data.roomId);
            document.getElementById('spy-login-screen').classList.add('hidden');
            document.getElementById('spy-game-screen').classList.remove('hidden');
            document.getElementById('spy-room-badge').innerText = data.roomId;
        });

        socket.on('spy_left_success', () => {
            localStorage.removeItem('spy_room');
            location.href = location.pathname;
        });

        socket.on('spy_state_update', (room) => {
            const myToken = getSpyToken();
            const isHost = (room.hostToken === myToken);
            const me = Object.values(room.players).find(p => p.token === myToken);
            const players = Object.values(room.players);

            document.getElementById('spy-players-bar').innerHTML = players.map(p => `
                <div class="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs flex gap-2 items-center shrink-0">
                    <span class="font-bold text-white">${p.name}</span>
                    ${room.status === 'waiting' ? (p.token === room.hostToken ? '<span class="text-indigo-400 font-bold">방장</span>' : (p.isReady ? '✅ 준비' : '⏳ 대기')) : ''}
                </div>
            `).join('');

            if (room.status === 'waiting') {
                const btnArea = document.getElementById('spy-action-btn-area');
                if (isHost) {
                    btnArea.innerHTML = `<button onclick="socket.emit('spy_start_game', '${myToken}')" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-black text-white text-base transition shadow-lg">게임 시작</button>`;
                } else {
                    const ready = me && me.isReady;
                    btnArea.innerHTML = `<button onclick="socket.emit('spy_toggle_ready', '${myToken}')" class="w-full ${ready ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500'} py-3 rounded-xl font-black text-white text-base transition shadow-lg">${ready ? '준비 취소' : '준비 완료'}</button>`;
                }
            }

            if (room.status === 'playing' || room.status === 'voting') {
                document.getElementById('waiting-host-panel').classList.add('hidden');
                document.getElementById('role-card-panel').classList.remove('hidden');
                document.getElementById('control-panel').classList.remove('hidden');
                document.getElementById('game-timer').classList.remove('hidden');

                if (me) {
                    const card = document.getElementById('card-content');
                    if (me.isSpy) {
                        card.innerHTML = `<span class="text-rose-500">🕵️ 당신은 스파이입니다!</span><div class="text-xs text-slate-400 mt-1">시민들의 대화를 통해 장소를 눈치채세요.</div>`;
                        document.getElementById('spy-guess-btn').classList.remove('hidden');
                    } else {
                        card.innerHTML = `📍 장소: <span class="text-emerald-400">${room.currentLocation}</span><br>🏷️ 역할: <span class="text-indigo-300">${me.role}</span>`;
                        document.getElementById('spy-guess-btn').classList.add('hidden');
                    }
                }

                const currentTurnPlayer = players[room.turnIndex];
                const isMyTurn = currentTurnPlayer && currentTurnPlayer.token === myToken;

                const turnNotice = document.getElementById('turn-notice');
                if (isMyTurn) {
                    turnNotice.innerHTML = `👉 <span class="text-emerald-400">당신의 차례입니다!</span> 다른 플레이어에게 질문을 던지고 지목하세요.`;
                } else {
                    turnNotice.innerHTML = `⏳ 현재 질문 차례: <span class="text-indigo-300">${currentTurnPlayer ? currentTurnPlayer.name : ''}</span>님`;
                }

                const select = document.getElementById('target-select');
                select.innerHTML = players.filter(p => p.token !== myToken).map(p => `<option value="${p.token}">${p.name}</option>`).join('');
            }

            if (room.status === 'voting') {
                document.getElementById('vote-modal').classList.remove('hidden');
                const accused = players.find(p => p.token === room.accusedToken);
                document.getElementById('vote-target-text').innerText = `플레이어 [${accused ? accused.name : ''}]님을 스파이로 지목했습니다. 찬성하시겠습니까?`;
            } else {
                document.getElementById('vote-modal').classList.add('hidden');
            }

            if (room.status === 'ended') {
                document.getElementById('spy-game-over-modal').classList.remove('hidden');
                document.getElementById('end-reason-text').innerText = room.endReason;
            }
        });

        socket.on('spy_timer_tick', (timeLeft) => {
            const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const sec = String(timeLeft % 60).padStart(2, '0');
            document.getElementById('game-timer').innerText = `⏱️ ${min}:${sec}`;
        });

        socket.on('spy_error', alert);

        function passTurn() {
            const targetToken = document.getElementById('target-select').value;
            if (!targetToken) return;
            socket.emit('spy_pass_turn', { token: getSpyToken(), targetToken });
        }

        function openAccuseModal() {
            const targetToken = document.getElementById('target-select').value;
            if (!targetToken) return;
            if (confirm('정말 이 플레이어를 스파이로 지목하고 투표를 시작하시겠습니까?')) {
                socket.emit('spy_accuse', { token: getSpyToken(), targetToken });
            }
        }

        function castVote(agree) {
            socket.emit('spy_vote', { token: getSpyToken(), agree });
            document.getElementById('vote-modal').classList.add('hidden');
        }

        function openGuessModal() {
            const guess = prompt('현재 장소가 어디인지 입력하세요 (예: 해수욕장 🏖️):');
            if (guess) {
                socket.emit('spy_guess_location', { token: getSpyToken(), guessedLocation: guess.trim() });
            }
        }
    </script>
</body>
</html>
