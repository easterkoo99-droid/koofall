<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스파이폴 온라인</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Pretendard', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <div class="text-center mb-5">
            <h1 class="text-3xl font-extrabold text-indigo-400">🕵️‍♂️ SPYFALL ONLINE</h1>
            <p class="text-sm text-slate-400 mt-1">자유로운 방 채팅 & 40개 장소</p>
        </div>

        <!-- 1. 로그인 (닉네임 & 방 코드) -->
        <div id="screen-login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">내 닉네임</label>
                <input type="text" id="player-name" placeholder="이름을 입력하세요" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">방 코드 (친구들과 동일하게 입력)</label>
                <input type="text" id="room-id" value="room1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <button onclick="joinRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3.5 rounded-xl transition cursor-pointer">
                🚀 방 들어가기
            </button>
        </div>

        <!-- 2. 통합 방 화면 (입장 직후부터 채팅 + 인원 확인 + 게임 시작 가능) -->
        <div id="screen-room" class="hidden space-y-4">
            <!-- 상단 정보 및 시작 버튼 -->
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                <div>
                    <span class="text-[11px] text-slate-400 block">현재 접속 인원</span>
                    <span id="player-count" class="text-sm font-bold text-indigo-300">0명 (최소 3명 필요)</span>
                </div>
                <button onclick="requestStartGame()" class="bg-green-600 hover:bg-green-500 font-bold px-4 py-2 rounded-xl text-xs transition cursor-pointer">
                    🚀 게임 시작
                </button>
            </div>

            <!-- 게임 중일 때만 표시되는 신분/장소 박스 -->
            <div id="game-info-box" class="hidden bg-indigo-900/60 border border-indigo-500/50 rounded-xl p-3 flex justify-between items-center">
                <div>
                    <span class="text-xs text-slate-400 block">내 신분</span>
                    <span id="my-role-box" class="font-bold text-sm"></span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">장소</span>
                    <span id="my-location-box" class="font-bold text-sm text-indigo-300"></span>
                </div>
            </div>

            <!-- 장소 목록 접이식 버튼 -->
            <div class="flex justify-between items-center bg-slate-900/50 p-2.5 rounded-xl border border-slate-700/50 text-xs">
                <span class="text-slate-400">🗺️ 40개 장소 목록 보기</span>
                <button onclick="toggleLocations()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg font-semibold cursor-pointer">열기/닫기</button>
            </div>
            <div id="location-panel" class="hidden bg-slate-900 border border-slate-700 rounded-xl p-3 max-h-36 overflow-y-auto text-xs grid grid-cols-2 gap-1 text-slate-400"></div>

            <!-- 대화 및 채팅창 (입장하자마자 이용 가능) -->
            <div id="chat-box" class="bg-slate-900 border border-slate-700 rounded-xl h-52 overflow-y-auto p-3 space-y-2 text-xs flex flex-col"></div>

            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none">
                <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">전송</button>
            </div>

            <!-- 게임 중에만 뜨는 종료 버튼 -->
            <button id="vote-btn" onclick="triggerVote()" class="hidden w-full bg-red-600/80 hover:bg-red-600 text-xs font-bold py-2.5 rounded-xl cursor-pointer">🚨 지목 투표 및 게임 종료</button>
        </div>

        <!-- 3. 결과 화면 -->
        <div id="screen-result" class="hidden space-y-4 text-center">
            <h2 class="text-2xl font-extrabold text-indigo-400">게임 종료</h2>
            <p id="result-desc" class="text-sm text-slate-300 leading-relaxed"></p>
            <button onclick="location.reload()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl cursor-pointer">🔄 방으로 돌아가기</button>
        </div>
    </div>

    <script>
        const socket = io();
        let state = { me: "", players: [] };

        function joinRoom() {
            const name = document.getElementById('player-name').value.trim();
            const roomId = document.getElementById('room-id').value.trim();
            if (!name || !roomId) return alert('닉네임과 방 코드를 입력하세요!');

            state.me = name;
            socket.emit('joinRoom', { roomId, name });

            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-room').classList.remove('hidden');
        }

        socket.on('roomData', ({ players }) => {
            state.players = players.map(p => p.name);
            document.getElementById('player-count').innerText = `${players.length}명 참여중 (${state.players.join(', ')})`;
        });

        socket.on('systemMessage', (msg) => {
            appendChat('system', msg);
        });

        socket.on('chatMessage', ({ sender, text }) => {
            appendChat(sender, text);
        });

        function appendChat(sender, text) {
            const chatBox = document.getElementById('chat-box');
            if (sender === 'system') {
                chatBox.innerHTML += `<div class="text-center text-slate-500 text-[11px] my-1">--- ${text} ---</div>`;
            } else {
                const isMe = (sender === state.me);
                chatBox.innerHTML += `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                        <span class="text-[10px] text-slate-400 mb-0.5">${sender}</span>
                        <div class="max-w-[85%] rounded-xl px-3 py-2 bg-slate-800 border border-slate-700 text-xs">${text}</div>
                    </div>
                `;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            socket.emit('sendMessage', text);
            input.value = '';
        }

        function requestStartGame() {
            socket.emit('startGame');
        }

        socket.on('errorMsg', (msg) => alert(msg));

        socket.on('gameStarted', ({ isSpy, location, players, locationsList }) => {
            state.players = players;
            document.getElementById('game-info-box').classList.remove('hidden');
            document.getElementById('vote-btn').classList.remove('hidden');

            document.getElementById('my-role-box').innerText = isSpy ? "🕵️‍♂️ 스파이" : "🛡️ 시민";
            document.getElementById('my-location-box').innerText = isSpy ? "???" : `${location.icon} ${location.name}`;

            renderLocations(locationsList);
            appendChat('system', '🎮 게임이 시작되었습니다!');
        });

        function triggerVote() {
            socket.emit('triggerVote');
        }

        socket.on('gameEnded', ({ location, spyName }) => {
            document.getElementById('screen-room').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            
            document.getElementById('result-desc').innerHTML = `
                정답 장소: <strong class="text-indigo-300">${location.icon} ${location.name}</strong><br><br>
                진짜 스파이: <strong class="text-red-400">${spyName}</strong>
            `;
        });

        function renderLocations(locations) {
            const listEl = document.getElementById('location-panel');
            listEl.innerHTML = locations.map(loc => `<div class="bg-slate-800 p-1.5 rounded text-center border border-slate-700/50 flex items-center justify-center gap-1.5"><span>${loc.icon}</span><span>${loc.name}</span></div>`).join('');
        }

        function toggleLocations() {
            document.getElementById('location-panel').classList.toggle('hidden');
        }
    </script>
</body>
</html>
