<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스파이폴 온라인</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Pretendard', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <div class="text-center mb-5">
            <h1 class="text-3xl font-extrabold text-indigo-400">🕵️‍♂️ SPYFALL ONLINE</h1>
            <p class="text-sm text-slate-400 mt-1">40개 장소 확장 & 실시간 대기실</p>
        </div>

        <!-- 1. 로비 / 방 입장 -->
        <div id="screen-lobby" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">내 닉네임</label>
                <input type="text" id="player-name" placeholder="이름을 입력하세요" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">방 코드 (친구들과 동일하게 입력)</label>
                <input type="text" id="room-id" value="room1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <button onclick="joinRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3.5 rounded-xl transition cursor-pointer">
                🚀 방 입장하기
            </button>
        </div>

        <!-- 2. 대기실 (준비 및 시작) -->
        <div id="screen-waiting" class="hidden space-y-4">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                <h2 class="text-xs text-slate-400 mb-2">참여자 대기실 (최소 3명 필요)</h2>
                <ul id="player-list" class="space-y-2 text-sm"></ul>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
                <button onclick="toggleReady()" id="ready-btn" class="bg-amber-600 hover:bg-amber-500 font-bold py-3 rounded-xl transition cursor-pointer text-xs">
                    ✋ 준비하기
                </button>
                <button onclick="requestStartGame()" class="bg-green-600 hover:bg-green-500 font-bold py-3 rounded-xl transition cursor-pointer text-xs">
                    🚀 게임 시작
                </button>
            </div>
            <p class="text-[11px] text-slate-400 text-center">3명 이상 모이면 누구나 게임 시작을 누를 수 있습니다.</p>
        </div>

        <!-- 3. 게임 진행 -->
        <div id="screen-game" class="hidden space-y-4">
            <div class="bg-indigo-900/60 border border-indigo-500/50 rounded-xl p-3 flex justify-between items-center">
                <div>
                    <span class="text-[10px] text-indigo-300 font-medium block">현재 질문 턴</span>
                    <span id="current-turn-text" class="text-sm font-bold text-amber-300">🎤 -</span>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-indigo-300 font-medium block">남은 시간</span>
                    <span id="timer" class="text-sm font-mono font-bold text-amber-400">05:00</span>
                </div>
            </div>

            <div class="bg-slate-900/80 border border-slate-700 rounded-xl p-3 flex justify-between items-center">
                <div>
                    <span class="text-xs text-slate-400 block">내 신분</span>
                    <span id="my-role-box" class="font-bold text-sm"></span>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">장소</span>
                    <span id="my-location-box" class="font-bold text-sm text-indigo-300"></span>
                </div>
            </div>

            <div class="flex justify-between items-center bg-slate-900/50 p-2.5 rounded-xl border border-slate-700/50 text-xs">
                <span class="text-slate-400">🗺️ 총 40개 장소 목록 확인</span>
                <button onclick="toggleLocations()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg font-semibold cursor-pointer">목록 열기</button>
            </div>

            <div id="location-panel" class="hidden bg-slate-900 border border-slate-700 rounded-xl p-3 max-h-48 overflow-y-auto text-xs grid grid-cols-2 gap-1 text-slate-400"></div>

            <div id="chat-box" class="bg-slate-900 border border-slate-700 rounded-xl h-44 overflow-y-auto p-3 space-y-2 text-xs flex flex-col"></div>

            <div id="input-area" class="space-y-2 bg-slate-900/90 p-3 rounded-xl border border-slate-700">
                <div class="text-xs text-slate-400 font-semibold">1️⃣ 질문 상대 선택:</div>
                <div id="target-buttons" class="flex gap-1.5 overflow-x-auto pb-1"></div>

                <div class="flex gap-2 pt-1">
                    <input type="text" id="chat-input" placeholder="질문 내용..." onkeypress="if(event.key==='Enter') sendQuestion()" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none" disabled>
                    <button id="send-btn" onclick="sendQuestion()" class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer" disabled>전송</button>
                </div>
            </div>

            <button onclick="triggerVote()" class="w-full bg-red-600/80 hover:bg-red-600 text-xs font-bold py-2.5 rounded-xl cursor-pointer">🚨 지목 투표 및 게임 종료</button>
        </div>

        <!-- 4. 결과 화면 -->
        <div id="screen-result" class="hidden space-y-4 text-center">
            <h2 id="result-title" class="text-2xl font-extrabold text-indigo-400">게임 종료</h2>
            <p id="result-desc" class="text-sm text-slate-300 leading-relaxed"></p>
            <button onclick="location.reload()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl cursor-pointer">🔄 다시 하기</button>
        </div>
    </div>

    <script>
        const socket = io();
        let isReady = false;

        let state = {
            me: "",
            players: [],
            currentTurn: "",
            lastQuestioner: "",
            selectedTarget: "",
            isSpy: false,
            timeLeft: 300,
            timerInterval: null
        };

        function joinRoom() {
            const name = document.getElementById('player-name').value.trim();
            const roomId = document.getElementById('room-id').value.trim();
            if (!name || !roomId) return alert('닉네임과 방 코드를 입력하세요!');

            state.me = name;
            socket.emit('joinRoom', { roomId, name });

            document.getElementById('screen-lobby').classList.add('hidden');
            document.getElementById('screen-waiting').classList.remove('hidden');
        }

        function toggleReady() {
            isReady = !isReady;
            const btn = document.getElementById('ready-btn');
            if (isReady) {
                btn.className = "bg-green-700 hover:bg-green-600 font-bold py-3 rounded-xl transition cursor-pointer text-xs";
                btn.innerText = "✅ 준비 완료됨";
            } else {
                btn.className = "bg-amber-600 hover:bg-amber-500 font-bold py-3 rounded-xl transition cursor-pointer text-xs";
                btn.innerText = "✋ 준비하기";
            }
            socket.emit('toggleReady');
        }

        socket.on('roomData', ({ players }) => {
            state.players = players.map(p => p.name);
            const listEl = document.getElementById('player-list');
            listEl.innerHTML = players.map(p => `
                <li class="flex justify-between items-center bg-slate-800 px-3 py-2 rounded-lg border border-slate-700">
                    <span class="font-bold">${p.name} ${p.name === state.me ? '(나)' : ''}</span>
                    <span class="text-xs px-2 py-1 rounded ${p.ready ? 'bg-green-600/30 text-green-400 border border-green-500/30' : 'bg-slate-700 text-slate-400'}">
                        ${p.ready ? '준비 완료 ✅' : '대기중 ⏳'}
                    </span>
                </li>
            `).join('');
        });

        socket.on('errorMsg', (msg) => alert(msg));

        function requestStartGame() {
            socket.emit('startGame');
        }

        socket.on('gameStarted', ({ isSpy, location, players, currentTurn, locationsList }) => {
            state.isSpy = isSpy;
            state.players = players;
            state.currentTurn = currentTurn;

            document.getElementById('screen-waiting').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');

            document.getElementById('my-role-box').innerText = isSpy ? "🕵️‍♂️ 스파이" : "🛡️ 시민";
            document.getElementById('my-location-box').innerText = isSpy ? "???" : `${location.icon} ${location.name}`;

            renderLocations(locationsList);
            updateTurnUI();
            startTimer();
        });

        function updateTurnUI() {
            document.getElementById('current-turn-text').innerText = `🎤 ${state.currentTurn} 님`;
            const isMyTurn = (state.currentTurn === state.me);
            
            document.getElementById('chat-input').disabled = !isMyTurn;
            document.getElementById('send-btn').disabled = !isMyTurn;

            renderTargetButtons();
        }

        function renderTargetButtons() {
            const container = document.getElementById('target-buttons');
            container.innerHTML = '';

            state.players.forEach(p => {
                if (p === state.me) return;
                const isBlocked = (p === state.lastQuestioner);
                const isSelected = (p === state.selectedTarget);

                let btnClass = isSelected ? "bg-indigo-600 text-white font-bold" : "bg-slate-800 text-slate-300";
                if (isBlocked) btnClass = "bg-slate-900 text-slate-600 cursor-not-allowed";

                container.innerHTML += `
                    <button onclick="selectTarget('${p}')" ${isBlocked ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg border border-slate-700 text-xs transition cursor-pointer ${btnClass}">
                        ${p} ${isBlocked ? '(직전)' : ''}
                    </button>
                `;
            });
        }

        function selectTarget(target) {
            state.selectedTarget = target;
            renderTargetButtons();
        }

        function sendQuestion() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!state.selectedTarget) return alert('질문 대상을 먼저 선택해주세요!');
            if (!text) return;

            socket.emit('sendQuestion', { target: state.selectedTarget, text: text });
            input.value = '';
            state.selectedTarget = "";
        }

        socket.on('chatMessage', ({ sender, target, text }) => {
            const chatBox = document.getElementById('chat-box');
            const isMe = (sender === state.me);
            const align = isMe ? 'items-end' : 'items-start';
            const bg = isMe ? 'bg-indigo-600/30 border-indigo-500/40' : 'bg-slate-800 border-slate-700';

            chatBox.innerHTML += `
                <div class="flex flex-col ${align}">
                    <span class="text-[10px] text-slate-400 mb-0.5">${sender}</span>
                    <div class="max-w-[85%] rounded-xl px-3 py-2 border text-xs ${bg}">👉 <b>@${target}</b>: ${text}</div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        socket.on('turnChanged', ({ currentTurn, lastQuestioner }) => {
            state.currentTurn = currentTurn;
            state.lastQuestioner = lastQuestioner;
            updateTurnUI();
        });

        function triggerVote() {
            socket.emit('triggerVote');
        }

        socket.on('gameEnded', ({ location, spyName }) => {
            clearInterval(state.timerInterval);
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            
            document.getElementById('result-desc').innerHTML = `
                정답 장소: <strong class="text-indigo-300">${location.icon} ${location.name}</strong><br><br>
                진짜 스파이: <strong class="text-red-400">${spyName}</strong>
            `;
        });

        function renderLocations(locations) {
            const listEl = document.getElementById('location-panel');
            listEl.innerHTML = locations.map(loc => `<div class="bg-slate-800 p-1.5 rounded text-center border border-slate-700/50 flex items-center justify-center gap-1.5"><span>${loc.icon}</span><span>${loc.name}</span></div>`).join('');
        }

        function toggleLocations() {
            document.getElementById('location-panel').classList.toggle('hidden');
        }

        function startTimer() {
            clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                let m = Math.floor(state.timeLeft / 60);
                let s = state.timeLeft % 60;
                document.getElementById('timer').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                if (state.timeLeft <= 0) clearInterval(state.timerInterval);
            }, 1000);
        }
    </script>
</body>
</html>
